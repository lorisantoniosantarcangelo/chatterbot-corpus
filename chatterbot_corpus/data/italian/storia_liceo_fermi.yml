conversations:
- - Quando è stato fondato l’I.I.S. Enrico Fermi di Policoro?
  - L’istituto è stato istituito nell’anno scolastico 1967-68 come sede staccata del Liceo Scientifico Dante Alighieri di Matera.
- - Qual era la prima sede del liceo Enrico Fermi di Policoro?
  - La prima sede era una struttura provvisoria, priva di palestra e con spazi ridotti per docenti e studenti.
- - Quando la scuola ha ottenuto una sede definitiva?
  - La sede definitiva è stata inaugurata nel 1987, con ambienti più idonei allo svolgimento delle attività didattiche.
- - Perché la scuola si chiama Enrico Fermi?
  - La denominazione rende omaggio al fisico Enrico Fermi, figura centrale della scienza del Novecento e simbolo di ricerca, innovazione e metodo scientifico.
- - Quali indirizzi di studio offre oggi l’I.I.S. Enrico Fermi di Policoro?
  - L’istituto offre diversi indirizzi come il Liceo Scientifico, Liceo Scientifico Scienze Applicate, Liceo Linguistico, Liceo Classico, Liceo Artistico e Istituto Tecnico Trasporti e Logistica.
- - Qual è il codice meccanografico dell’istituto?
  - Il codice meccanografico dell’I.I.S. Enrico Fermi è MTIS01700X.
- - Dove si trova la sede principale del liceo?
  - La sede principale si trova in Via Puglia 8, Policoro, in provincia di Matera.
- - Come si è sviluppata la scuola nel corso degli anni?
  - L’istituto è passato da semplice sede staccata negli anni Sessanta a scuola autonoma, ampliando progressivamente spazi e indirizzi di studio e diventando un punto di riferimento per il territorio.
- - Qual è il ruolo dell’istituto nel territorio di Policoro?
  - Il liceo ha avuto un ruolo fondamentale nella formazione delle generazioni locali, offrendo percorsi liceali e tecnici senza la necessità di spostarsi fuori dal comune.
- - Ci sono stati eventi importanti nella storia recente della scuola?
  - Negli ultimi anni l’istituto ha rinnovato la propria infrastruttura digitale, modernizzato il sito web e ampliato l’offerta formativa, continuando a crescere come polo educativo della zona.
- - La scuola ha un legame con il patrimonio culturale della zona?
  - Sì, l’istituto si trova in un'area ricca di storia, vicino al Museo Archeologico Nazionale della Siritide, e partecipa spesso a iniziative culturali legate al territorio.
- - La storia della scuola comprende cambiamenti strutturali rilevanti?
  - Il cambiamento strutturale più significativo è stato il passaggio dalla sede provvisoria alla sede definitiva nel 1987, oltre all’introduzione negli anni di nuovi indirizzi liceali e tecnici.
